<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>종베 스캐너</title><style>body{margin:0;background:#101827;color:#f3f6fc;font-family:system-ui,sans-serif}main{max-width:720px;margin:auto;padding:22px}h1{font-size:26px}p{color:#b9c7db;line-height:1.6}.badge{background:#3b2b13;color:#ffd995;border-radius:8px;padding:10px;display:inline-block}.card{background:#1b2940;border:1px solid #30425c;border-radius:15px;padding:16px;margin:14px 0}.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.score{font-size:24px;color:#7ce5b7;font-weight:bold}small{color:#b9c7db}button{background:#5f8ef9;color:white;border:0;border-radius:10px;padding:12px 20px;font-size:16px}#status{margin-top:12px}</style></head><body><main><h1>📈 종베 스캐너</h1><div class="badge">⚠️ 일별 확정 시세 · 실시간 아님</div><p>무료 데이터 기반 1차 시제품입니다. 매 거래일 16:10(KST)에 서버가 실행 중이면 자동 분석합니다. 장 마감 전 매수 판단에 사용하지 마세요.</p><button id="refresh">결과 새로고침</button><p id="status" aria-live="polite">불러오는 중...</p><section id="results"></section><p><small>점수는 단순 조건 충족도이며 상승 확률이 아닙니다. 목표 +3%, 손절 -2%는 교육용 예시입니다. 투자 판단은 직접 하세요.</small></p></main><script>const out=document.getElementById('results'),status=document.getElementById('status');const won=n=>Number(n).toLocaleString('ko-KR')+'원';async function load(){status.textContent='불러오는 중...';try{const r=await fetch('/api/results',{cache:'no-store'});if(!r.ok)throw Error('서버 오류');const d=await r.json();status.textContent=`기준일: ${d.asof||'없음'} · 갱신: ${d.updated||'대기 중'}${d.error?' · 오류: '+d.error:''}`;out.replaceChildren();if(!d.rows.length){out.textContent='조건에 맞는 종목이 없거나 데이터가 준비되지 않았습니다.';return}for(const x of d.rows){const c=document.createElement('article');c.className='card';const h=document.createElement('div');h.className='row';const name=document.createElement('strong');name.textContent=x.name+' ('+x.code+')';const score=document.createElement('span');score.className='score';score.textContent=x.score+'점';h.append(name,score);const p=document.createElement('p');p.textContent=`종가 ${won(x.price)} · 등락 ${x.change}% · 거래대금 ${x.value_eok}억원`;const s=document.createElement('small');s.textContent=`종가 위치 ${x.close_position}% · 예시 목표 ${won(x.target)} / 손절 ${won(x.stop)}`;c.append(h,p,s);out.append(c)}}catch(e){status.textContent='데이터를 불러오지 못했습니다: '+e.message}}document.getElementById('refresh').addEventListener('click',load);load();setInterval(load,60000)</script></body></html>
