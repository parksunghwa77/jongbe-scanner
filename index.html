<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>종베 스캐너</title><style>body{margin:0;background:#101827;color:#f3f6fc;font-family:system-ui,sans-serif}main{max-width:720px;margin:auto;padding:22px}h1{font-size:26px}p{color:#b9c7db;line-height:1.6}.badge{background:#3b2b13;color:#ffd995;border-radius:8px;padding:10px;display:inline-block}.card{background:#1b2940;border:1px solid #30425c;border-radius:15px;padding:16px;margin:14px 0}.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.score{font-size:24px;color:#7ce5b7;font-weight:bold}small{color:#b9c7db}button{background:#5f8ef9;color:white;border:0;border-radius:10px;padding:12px 20px;font-size:16px}#status{margin-top:12px}</style></head><body><main><h1>📈 종베 스캐너</h1><div class="badge">⚠️ 일별 확정 시세 · 실시간 아님</div><p>무료 데이터 기반 시험판입니다. 평일 16:30(KST) 이후 예약 분석을 시도하며 지연되거나 실패할 수 있습니다. 장 마감 전 매수 판단에 사용하지 마세요.</p><button id="refresh">결과 새로고침</button><p id="status" aria-live="polite">불러오는 중...</p><section id="results"></section><p><small>15개 시범 종목만 검색합니다. 점수는 단순 조건 충족도이며 상승 확률이 아닙니다. 거래대금은 종가×거래량 근사치입니다. 목표 +3%, 손절 -2%는 교육용 예시입니다.</small></p></main><script>const out=document.getElementById('results'),status=document.getElementById('status');const won=n=>Number(n).toLocaleString('ko-KR')+'원';async function load(){status.textContent='불러오는 중...';try{const r=await fetch('./results.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('결과 파일이 아직 없거나 배포되지 않았습니다 ('+r.status+')');const d=await r.json();status.textContent=`기준일: ${d.asof||'없음'} · 갱신: ${d.updated||'대기 중'} · 분석 ${d.rows?.length||0}종목`;out.replaceChildren();if(!d.rows?.length){out.textContent='분석 결과가 없습니다. GitHub Actions 실행 기록을 확인하세요.';return}for(const x of d.rows){const c=document.createElement('article');c.className='card';const h=document.createElement('div');h.className='row';const name=document.createElement('strong');name.textContent=x.name+' ('+x.code+')';const score=document.createElement('span');score.className='score';score.textContent=x.score+'점';h.append(name,score);const p=document.createElement('p');p.textContent=`종가 ${won(x.price)} · 등락 ${x.change}% · 거래대금(근사) ${x.value_eok}억원`;const s=document.createElement('small');s.textContent=`종가 위치 ${x.close_position}% · 거래량 배수 ${x.volume_ratio} · 예시 목표 ${won(x.target)} / 손절 ${won(x.stop)}`;c.append(h,p,s);out.append(c)}}catch(e){status.textContent='데이터를 불러오지 못했습니다: '+e.message}}document.getElementById('refresh').addEventListener('click',load);load()</script></body></html>
