name: Namuh PLUG two stocks quote test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quote-two-stocks:
    name: Read-only two stock quotes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NHPLUG_APP_KEY: ${{ secrets.NAMUH_APP_KEY }}
      NHPLUG_APP_SECRET: ${{ secrets.NAMUH_APP_SECRET_KEY }}
      NHPLUG_BASE_URL: https://api.nhplug.com:8443
      NHPLUG_AUTH_URL: https://api.nhplug.com:8443
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install official NHPLUG SDK
        run: python -m pip install nhplug

      - name: Check read-only quotes for Samsung Electronics and SK hynix
        shell: bash
        run: |
          python - <<'PY'
          import os
          import sys
          from datetime import datetime
          from decimal import Decimal, InvalidOperation
          from zoneinfo import ZoneInfo

          from nhplug import call

          if not os.getenv('NHPLUG_APP_KEY') or not os.getenv('NHPLUG_APP_SECRET'):
              sys.exit('FAIL: GitHub Secrets names or values are missing.')

          def number(value):
              if value is None or str(value).strip() == '':
                  return None
              try:
                  return Decimal(str(value).replace(',', ''))
              except InvalidOperation:
                  return None

          stocks = [('005930', '삼성전자'), ('000660', 'SK하이닉스')]
          now_kst = datetime.now(ZoneInfo('Asia/Seoul')).strftime('%Y-%m-%d %H:%M:%S KST')
          print('조회 시각:', now_kst)
          print('조회 방식: NHPLUG REST 현재가, 통합시장(UNT), 읽기 전용')
          print('주의: 조회 시각은 체결 시각이 아닙니다. 장외에는 마지막 시세일 수 있습니다.')

          errors = []
          for code, name in stocks:
              try:
                  response = call('/krstock/quote/v1/currentPrice', {
                      'iem_cd': code,
                      'market_cd': 'UNT',
                  })
                  row = response.get('Output_0') if isinstance(response, dict) else None
                  if isinstance(row, list):
                      row = row[0] if row else None
                  if not isinstance(row, dict):
                      raise ValueError('현재가 응답의 Output_0가 비어 있거나 형식이 다릅니다.')

                  price = number(row.get('stck_prpr'))
                  volume = number(row.get('acml_vol'))
                  traded = number(row.get('acml_tr_pbmn'))

                  if price is None or price <= 0:
                      raise ValueError('현재가(stck_prpr)가 없습니다. API 응답 필드 확인 필요.')

                  print(f'\n[{name} / {code}]')
                  print(f'  현재가: {price:,.0f} 원')
                  if volume is not None:
                      print(f'  누적 거래량: {volume:,.0f} 주')
                  else:
                      print('  누적 거래량: 필드 없음 (응답 스키마 확인 필요)')
                  if traded is not None:
                      print(f'  누적 거래대금: {traded:,.0f} (API 응답 원값; 단위 확인 필요)')
                  else:
                      print('  누적 거래대금: 필드 없음 (응답 스키마 확인 필요)')
                  if volume is None or traded is None:
                      print('  주의: 이 응답에서 해당 필드를 확인하지 못했습니다.')
              except Exception as error:
                  # Only print a fixed diagnostic, NOT raw API responses,
                  # authorization headers, exceptions, tokens, or secrets.
                  errors.append(name)
                  print(f'FAIL: {name} ({code}) 조회/파싱에 실패했습니다. 로그에서 원문·인증정보를 출력하지 않습니다.')

          if errors:
              print('조회 실패 종목:', ', '.join(errors))
              sys.exit(1)
          print('\nPASS: 두 종목 현재가 조회 완료 (거래량/거래대금 유무는 위 항목 확인)')
          PY
