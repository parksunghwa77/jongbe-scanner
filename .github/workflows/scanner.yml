name: Jongbe daily scan and publish

on:
  workflow_dispatch:
  schedule:
    - cron: "45 7 * * 1-5"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: jongbe-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout files
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Analyze stocks
        run: python scanner.py

      - name: Prepare website
        run: |
          mkdir -p site
          cp index.html results.json site/
          touch site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
