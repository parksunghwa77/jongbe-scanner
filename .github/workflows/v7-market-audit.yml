name: V7 Market Wide Audit (test only)

on:
  push:
    branches:
      - dev-naver-v7
    paths:
      - v7_market_audit.py
      - .github/workflows/v7-market-audit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    if: github.ref == 'refs/heads/dev-naver-v7'
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Audit latest MARCAP stock universe (no deployment)
        run: python v7_market_audit.py
