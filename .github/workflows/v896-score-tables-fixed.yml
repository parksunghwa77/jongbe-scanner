name: Jongbe V8.9.6 forward results tables FIXED (test only)

on:
  push:
    branches: [v8.8.4-test]
    paths:
      - '.github/workflows/v896-score-tables-fixed.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: jongbe-v896-score-tables-fixed
  cancel-in-progress: false

jobs:
  score-tables:
    runs-on: ubuntu-latest
    timeout-minutes: 42
    env:
      NHPLUG_APP_KEY: ${{ secrets.NAMUH_APP_KEY }}
      NHPLUG_APP_SECRET: ${{ secrets.NAMUH_APP_SECRET_KEY }}
      NHPLUG_BASE_URL: https://api.nhplug.com:8443
      NHPLUG_AUTH_URL: https://api.nhplug.com:8443
      NHPLUG_RATE_LIMIT: '2'
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      RUN_ID: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install existing read-only dependencies
        run: python -m pip install --disable-pip-version-check 'nhplug==0.4.1' 'exchange-calendars>=4.9,<5' pandas 'PyYAML>=6,<7'
      - name: Prepare existing V8.9.6 and select latest complete prior-session artifact
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import yaml
          wf=yaml.safe_load(Path('.github/workflows/v896-score-tables.yml').read_text(encoding='utf-8'))
          steps=wf['jobs']['score-tables']['steps']
          found=[x for x in steps if x.get('name')=='Prepare original frozen scoring, prior-day artifact and report tables']
          if len(found)!=1: raise RuntimeError('Existing V8.9.6 preparation step changed')
          Path('/tmp/v896-original-prepare.sh').write_text(found[0]['run']+'\n',encoding='utf-8')
          PY
          bash /tmp/v896-original-prepare.sh
          python - <<'PY'
          from pathlib import Path
          p=Path('/tmp/v896-context.sh')
          s=p.read_text(encoding='utf-8')
          before="a=min(candidates,key=lambda x:x['created_at'])"
          after="a=max(candidates,key=lambda x:x['created_at'])"
          if s.count(before)!=1: raise RuntimeError('Prior artifact choice point changed')
          p.write_text(s.replace(before,after),encoding='utf-8')
          PY
          bash -n /tmp/v896-context.sh
          bash -n /tmp/v896-scoring.sh
      - name: Verify previous trading day and market close
        id: context
        shell: bash
        run: |
          set -euo pipefail
          bash /tmp/v896-context.sh
      - name: Run unchanged score engine and publish readable tables
        if: steps.context.outputs.allow == 'true'
        shell: bash
        run: |
          set -euo pipefail
          bash /tmp/v896-scoring.sh
      - name: Upload records and CSV tables
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jongbe-v896-score-table-fixed-${{ github.run_id }}
          path: nh-v894/
          if-no-files-found: error
          retention-days: 90
          # 2026-11-17 evening verification
