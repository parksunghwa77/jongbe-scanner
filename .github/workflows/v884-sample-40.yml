name: V8.8.4 40 stocks diagnostics (read-only)

on:
  push:
    branches:
      - v8.8.4-test
    paths:
      - '.github/workflows/v884-sample-40.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install read-only research dependency
        run: python -m pip install 'finance-datareader==0.9.202' 'pandas>=2.2,<3'
      - name: Read 40 NAVER stock daily snapshots
        shell: bash
        run: |
          python - <<'PYTHON'
          """Read-only, 40-symbol NAVER EOD diagnostic, designed for an isolated GitHub Action.
          Does not change source prices, place orders, or publish any website.
          """
          import json
          import math
          import time
          from datetime import datetime, date
          from pathlib import Path
          from zoneinfo import ZoneInfo
          
          import FinanceDataReader as fdr
          import pandas as pd
          
          TARGET = '2026-10-30'
          PRIOR = '2026-10-29'
          KST = ZoneInfo('Asia/Seoul')
          REPORT_DIR = Path('v884-test-reports')
          REPORT_DIR.mkdir(exist_ok=True)
          
          
          def sample_20(pool, required=()):
              """Pick 20 evenly spaced distinct codes, preserving required references."""
              by_code = {str(row['code']).zfill(6):row for row in pool}
              selected = []
              for code in required:
                  if code in by_code and code not in selected:
                      selected.append(code)
              others = sorted(set(by_code).difference(selected))
              slots = 20 - len(selected)
              if slots > 0 and others:
                  idxs = [int(round(i * (len(others)-1)/max(slots-1,1))) for i in range(slots)]
                  for i in idxs:
                      if others[i] not in selected:
                          selected.append(others[i])
              return [(code, by_code[code]) for code in selected[:20]]
          
          
          def valid_bar(row):
              vals = []
              for k in ['Open','High','Low','Close','Volume']:
                  try:
                      val=float(row[k])
                      if not math.isfinite(val): return False
                      vals.append(val)
                  except (KeyError,TypeError,ValueError):return False
              o,h,l,c,v=vals
              return l>0 and l<=o<=h and l<=c<=h and v>=0
          
          
          def main():
              snapshot_path = Path('results.json')
              if not snapshot_path.exists():
                  raise RuntimeError('results.json missing from test branch')
              snapshot=json.loads(snapshot_path.read_text(encoding='utf-8'))
              rows=snapshot.get('rows',[])
              if not isinstance(rows,list):raise ValueError('rows must be list')
              dated=str(snapshot.get('asof'))
              if dated!=PRIOR:
                  raise RuntimeError('Prior-day snapshot must match 2026-10-29; got '+dated)
              pools={market:[x for x in rows if isinstance(x,dict) and x.get('market')==market and str(x.get('code','')).isdigit() and len(str(x['code']))==6]
                     for market in ('KOSPI','KOSDAQ')}
              selected = [('KOSPI',code,item) for code,item in sample_20(pools['KOSPI'],('005930','000660'))]
              selected += [('KOSDAQ',code,item) for code,item in sample_20(pools['KOSDAQ'])]
              if len(selected)!=40:raise RuntimeError('Expected exactly 40 sample symbols; got '+str(len(selected)))
              results=[]
              for i,(market,code,item) in enumerate(selected,1):
                  obj={'code':code,'name':str(item.get('name',''))[:80], 'market':market,
                       'snapshot_date':dated,'snapshot_close':item.get('price')}
                  for attempt in range(1,3):
                      try:
                          df=fdr.DataReader('NAVER:'+code, PRIOR, '2026-11-02')
                          if df is None or df.empty:raise ValueError('empty prices')
                          df=df.sort_index()
                          dates={str(pd.Timestamp(day).date()):i for i,day in enumerate(df.index)}
                          for day in (PRIOR,TARGET):
                              if day not in dates:
                                  obj['has_'+day]=False
                                  continue
                              row=df.iloc[dates[day]]
                              ok=valid_bar(row)
                              obj['has_'+day]=True
                              obj['valid_'+day]=ok
                              if ok:
                                  obj['close_'+day]=int(float(row['Close']))
                          oldclose=obj.get('close_'+PRIOR)
                          known=item.get('price')
                          if oldclose and known is not None:
                              obj['previous_source_matches']=(float(oldclose)==float(known))
                          if obj.get('valid_'+TARGET) and oldclose:
                              obj['day_pct']=round((obj['close_'+TARGET]/oldclose-1)*100,3)
                              obj['suspicious_jump']=abs(obj['day_pct'])>35
                          obj['error']=None
                          break
                      except Exception as exc:
                          obj['error']=type(exc).__name__+': '+str(exc)[:120]
                          if attempt==1:time.sleep(2)
                  results.append(obj)
                  print(f"{i:02d}/40 {code} {market} "+ ('ERROR '+obj['error'] if obj.get('error') else 
                        f"10/29 match={obj.get('previous_source_matches')} 10/30={obj.get('close_'+TARGET,'missing')}"),flush=True)
                  time.sleep(0.7)
              summary={
                  'schema':'jongbe-v884-40stock-probe-v1',
                  'created_at_kst':datetime.now(KST).isoformat(timespec='seconds'),
                  'target_session':TARGET,'snapshot_date':dated,
                  'sample_size':len(results),
                  'available_target':sum(bool(x.get('has_'+TARGET)) for x in results),
                  'valid_target':sum(bool(x.get('valid_'+TARGET)) for x in results),
                  'previous_match':sum(x.get('previous_source_matches') is True for x in results),
                  'previous_comparable':sum(x.get('previous_source_matches') is not None for x in results),
                  'errors':sum(bool(x.get('error')) for x in results),
                  'suspicious_jumps':sum(x.get('suspicious_jump') is True for x in results),
                  'reference_comparison':{
                      code:{'date':TARGET,'claimed_krx_1530_close':price,
                            'naver_close':next((x.get('close_'+TARGET) for x in results if x['code']==code),None),
                            'matches':next((x.get('close_'+TARGET)==price for x in results if x['code']==code and x.get('close_'+TARGET)),None),
                            'note':'manual reference, not independently authenticated exchange tick'}
                      for code,price in [('005930',225000),('000660',1418000)]},
                  'note':'Diagnostic only. NAVER and Marcap differences may reflect adjustments/session definitions. No data or orders modified.'
              }
              output={'summary':summary,'rows':results}
              (REPORT_DIR/'40-stock-results.json').write_text(json.dumps(output,ensure_ascii=False,indent=2),encoding='utf-8')
              print('SUMMARY '+json.dumps(summary,ensure_ascii=False),flush=True)
          
          if __name__=='__main__':main()
          PYTHON
      - name: Upload diagnostics artifact (even if some requests fail)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jongbe-v884-sample-40
          path: v884-test-reports/40-stock-results.json
          if-no-files-found: warn
          retention-days: 14
