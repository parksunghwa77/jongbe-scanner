name: 종베 스캐너 v6.3 - 장중 관찰 및 사후 기록

# 기존 scanner.yml / GitHub Pages 배포에는 영향 없음.
on:
  workflow_dispatch:
  schedule:
    - cron: '30 5 * * 1-5' # KST 평일 14:30 (UTC 05:30); GitHub 예약 지연 가능

permissions:
  contents: write  # 점수만 repository 파일로 갱신. 원시 시세/비밀키 비게시.

jobs:
  scan:
    name: v6 read-only afternoon scan
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GITHUB_TOKEN: ${{ github.token }}
      NHPLUG_APP_KEY: ${{ secrets.NAMUH_APP_KEY }}
      NHPLUG_APP_SECRET: ${{ secrets.NAMUH_APP_SECRET_KEY }}
      NHPLUG_BASE_URL: https://api.nhplug.com:8443
      NHPLUG_AUTH_URL: https://api.nhplug.com:8443
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install read-only SDK and exchange calendar
        run: python -m pip install --disable-pip-version-check nhplug exchange_calendars
      - name: Read-only afternoon watchlist scan
        shell: bash
        run: |
          python - <<'PY'
          """종베 스캐너 v6: 지정 종목의 NHPLUG REST 현재가를 조회하는 14:30 관찰 실험.

          주문 기능 없음. 공개 GitHub Pages/리포지토리에 시세/인증키를 자동 게시하지 않음.
          본 프로그램은 전 종목 실시간 스트리밍/5분봉/체결강도 검색기가 아닙니다.
          """
          import json
          import os
          import re
          import sys
          from datetime import datetime, date, time, timedelta
          from decimal import Decimal, InvalidOperation
          from pathlib import Path
          from zoneinfo import ZoneInfo

          KST = ZoneInfo("Asia/Seoul")
          # 첫 개발 단계는 관심종목/전날 후보를 합한 소규모 시범 검색.
          DEFAULT = [
              ("005930", "삼성전자"), ("000660", "SK하이닉스"),
              ("009150", "삼성전기"), ("042700", "한미반도체"),
              ("403870", "HPSP"), ("240810", "원익IPS"),
              ("095610", "테스"), ("084110", "휴온스글로벌"),
              ("200670", "휴메딕스"), ("035420", "NAVER"),
              ("006400", "삼성SDI"), ("105560", "KB금융"),
          ]
          MAX_CODES = 55
          MAX_SOURCE_AGE_DAYS = 7


          def number(v):
              if v is None or str(v).strip() in ("", "-"):
                  return None
              try:
                  x = Decimal(str(v).replace(",", "").replace("%", "").strip())
                  return x if x.is_finite() else None
              except (InvalidOperation, ValueError):
                  return None


          def integer(v):
              x = number(v)
              return int(x) if x is not None else None


          V5_PUBLISHED_JSON = "https://parksunghwa77.github.io/jongbe-scanner/results.json"


          def read_v5_candidates(now):
              """v5 published results take priority; repository root file may be a placeholder.

              Only public published data is fetched. No API key is sent to this URL.
              If live Pages output is unavailable or stale, try local results.json.
              """
              from urllib.request import Request, urlopen
              from urllib.error import HTTPError, URLError

              sources = (
                  ("GitHub Pages에 게시된 v5 결과", "published"),
                  ("GitHub 저장소의 v5 결과", "local"),
              )
              for label, mode in sources:
                  try:
                      if mode == "published":
                          req = Request(V5_PUBLISHED_JSON, headers={
                              "User-Agent": "jongbe-scanner-v6.1-readonly/1.0",
                              "Cache-Control": "no-cache",
                          })
                          with urlopen(req, timeout=12) as f:
                              blob = f.read(10_000_001)
                          if len(blob) > 10_000_000:
                              continue
                          obj = json.loads(blob.decode("utf-8"))
                      else:
                          path = Path("results.json")
                          if not path.is_file():
                              continue
                          obj = json.loads(path.read_text(encoding="utf-8"))
                      if not isinstance(obj, dict):
                          continue
                      asof_str = obj.get("asof")
                      if not isinstance(asof_str, str):
                          continue  # e.g., repository placeholder has asof:null
                      asof = date.fromisoformat(asof_str)
                      age = (now.date() - asof).days
                      rows = obj.get("rows")
                      if not (0 <= age <= MAX_SOURCE_AGE_DAYS and
                              isinstance(rows, list) and rows):
                          continue
                      return rows, asof, label
                  except (OSError, ValueError, TypeError, UnicodeError, HTTPError, URLError):
                      # A data source failure must not prevent read-only base watchlist scan.
                      continue
              return [], None, "기본 관심종목만 (v5 공개 데이터 확보 실패 또는 기준일 초과)"


          def candidates(now):
              """Use published v5 shortlist + base watchlist; limit API calls to 55 codes."""
              result = list(DEFAULT)
              v5_rows, asof, source_label = read_v5_candidates(now)
              accepted = 0
              for item in v5_rows:
                  if not isinstance(item, dict):
                      continue
                  code = str(item.get("code", "")).strip().zfill(6)
                  name = str(item.get("name") or code)[:24]
                  score = number(item.get("score"))
                  if (re.fullmatch(r"\d{6}", code) and
                          score is not None and score >= Decimal("50")):
                      result.append((code, name))
                      accepted += 1
                  if len({x[0] for x in result}) >= MAX_CODES:
                      break
              uniq = []
              seen = set()
              for code, name in result:
                  if code not in seen:
                      seen.add(code)
                      uniq.append((code, name))
                  if len(uniq) == MAX_CODES:
                      break
              if asof is not None:
                  source = (f"기본 관심종목 + {source_label} "
                            f"({asof}; v5에서 {accepted}개 후보 추가, 최대 {MAX_CODES}종목)")
              else:
                  source = source_label
              return uniq, source


          def market_session(now):
              if now.weekday() >= 5:
                  return False
              try:
                  import exchange_calendars as ec
                  # 주식시장 휴장일에는 후보 추천용 순위를 만들지 않음.
                  return bool(ec.get_calendar("XKRX").is_session(now.date().isoformat()))
              except Exception:
                  # 달력을 확인하지 못할 때는 안전하게 장중 후보 발표를 보류.
                  return False


          def parse_quote(obj, code, name):
              if not isinstance(obj, dict):
                  return None
              out = obj.get("Output_0")
              if isinstance(out, list):
                  out = out[0] if out else None
              if not isinstance(out, dict):
                  return None
              price = number(out.get("stck_prpr"))
              if price is None or price <= 0:
                  return None
              open_ = number(out.get("stck_oprc"))
              high = number(out.get("stck_hgpr"))
              low = number(out.get("stck_lwpr"))
              change = number(out.get("prdy_ctrt"))
              volume = integer(out.get("acml_vol"))
              traded = number(out.get("acml_tr_pbmn"))  # 단위를 미확인했으므로 원화 환산하지 않음.
              pos = None
              if high is not None and low is not None and high > low and low <= price <= high:
                  pos = (price - low) * 100 / (high - low)
              has_all = (open_ is not None and open_ > 0 and change is not None and
                         pos is not None and volume is not None and volume >= 0 and
                         traded is not None and traded >= 0)
              return {
                  "code": code, "name": name, "price": price,
                  "open": open_, "high": high, "low": low,
                  "pct": change, "volume": volume, "traded_raw": traded,
                  "position": pos, "complete": has_all,
              }


          def enrich_scores(data):
              complete = [r for r in data if r["complete"]]
              desc = sorted((r["traded_raw"] for r in complete), reverse=True)
              # '거래대금 상위'는 *검색한 55개 이내 목록 안*에서만 비교한다.
              # raw 값의 API 단위는 미확인; 다른 통화 또는 종목시장 합산 금지.
              cutoff = desc[max(0, (len(desc) - 1) // 4)] if desc else None
              for r in data:
                  if not r["complete"]:
                      r["score"] = None
                      r["caution"] = "필수 시세 필드 누락"
                      continue
                  pct = r["pct"]
                  risky = pct >= Decimal("15") or pct <= Decimal("-5")
                  r["score"] = (
                      (25 if r["price"] >= r["open"] else 0) +
                      (30 if r["position"] >= Decimal("75") else 0) +
                      (25 if Decimal("0") < pct <= Decimal("12") else 0) +
                      (10 if r["volume"] >= 100_000 else 0) +
                      (10 if cutoff is not None and r["traded_raw"] >= cutoff else 0)
                  )
                  r["caution"] = "급변 위험" if risky else ""
              return sorted(data, key=lambda r: (r["score"] is None, -(r["score"] or 0),
                                                 -(r["traded_raw"] or 0), r["code"]))


          def summary_table(rows):
              # GitHub Actions logs in a public repository may be public.
              # Do not write raw API quotes/prices/volumes to the public job summary.
              header = "| 종목 | 관찰점수 | 비고 |\n|---|---:|---|"
              lines = [header]
              for r in rows:
                  score = str(r["score"]) if r["score"] is not None else "평가불가"
                  name = str(r["name"]).replace("|", " ")[:24]
                  lines.append(f"| {name} ({r['code']}) | {score} | {r['caution'] or '-'} |")
              return "\n".join(lines)


          def write_summary(text):
              target = os.getenv("GITHUB_STEP_SUMMARY")
              if target:
                  # secrets/token/raw exception are never included.
                  with open(target, "a", encoding="utf-8") as f:
                      f.write(text + "\n")
              else:
                  print(text)


          def persist_v6_history(token, repo, previous, current):
              """Preserve first published valid afternoon snapshot per day, derived scores only."""
              import base64
              from urllib.request import Request, urlopen
              from urllib.error import HTTPError

              def normalise(doc):
                  if not isinstance(doc, dict) or doc.get("schema") != "jongbe-v6.2-public-scores":
                      return None
                  date_s = str(doc.get("session_date", ""))
                  if not re.fullmatch(r"\d{4}-\d{2}-\d{2}", date_s):
                      return None
                  rows = doc.get("rows")
                  if not isinstance(rows, list):
                      return None
                  safe = []
                  for row in rows[:55]:
                      if not isinstance(row, dict):
                          continue
                      code = str(row.get("code", ""))
                      score = row.get("score")
                      if not re.fullmatch(r"\d{6}", code) or type(score) is not int or not 0 <= score <= 100:
                          continue
                      safe.append({"code": code, "name": str(row.get("name", code))[:24],
                                   "score": score, "caution": str(row.get("caution", ""))[:40]})
                  if not safe:
                      return None
                  return {"session_date": date_s,
                          "generated_kst": str(doc.get("generated_kst", ""))[:35],
                          "rows": safe}

              endpoint = f"https://api.github.com/repos/{repo}/contents/v6-history.json"
              headers = {
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "User-Agent": "jongbe-v6.3-scores-history",
                  "X-GitHub-Api-Version": "2022-11-28",
              }
              existing_sha = None
              history = []
              try:
                  with urlopen(Request(endpoint + "?ref=main", headers=headers), timeout=15) as f:
                      response = json.load(f)
                  existing_sha = response.get("sha")
                  decoded = base64.b64decode(response.get("content", ""))
                  data = json.loads(decoded.decode("utf-8"))
                  if data.get("schema") != "jongbe-v6-performance-history-v1" or not isinstance(data.get("snapshots"), list):
                      raise RuntimeError("기존 v6-history.json 형식이 맞지 않습니다. 기록을 덮어쓰지 않았습니다.")
                  history = data["snapshots"]
              except HTTPError as e:
                  if e.code != 404:
                      raise RuntimeError(f"기록 조회 실패 (HTTP {e.code})") from None

              by_date = {}
              for raw in list(history) + [previous, current]:
                  # Existing history snapshots already have a different schema at the top level.
                  if raw is None:
                      continue
                  candidate = normalise(raw)
                  if candidate is None and isinstance(raw, dict) and "session_date" in raw and "rows" in raw:
                      candidate = normalise({**raw, "schema": "jongbe-v6.2-public-scores"})
                  if not candidate:
                      continue
                  date_s = candidate["session_date"]
                  # One immutable first successful snapshot per trade date; later re-runs must not replace it.
                  if date_s not in by_date or candidate["generated_kst"] < by_date[date_s]["generated_kst"]:
                      by_date[date_s] = candidate
              dates = sorted(by_date)[-120:]
              doc = {"schema": "jongbe-v6-performance-history-v1",
                     "description": "First afternoon derived-score snapshot per KRX session, no raw quotes or credentials; timestamp is workflow time, not tick time.",
                     "snapshots": [by_date[x] for x in dates]}
              body = {
                  "message": "data: archive v6 derived-score observation snapshot",
                  "branch": "main",
                  "content": base64.b64encode((json.dumps(doc, ensure_ascii=False, indent=2) + "\n").encode("utf-8")).decode("ascii"),
              }
              if existing_sha:
                  body["sha"] = existing_sha
              req = Request(endpoint, data=json.dumps(body).encode("utf-8"),
                            headers={**headers, "Content-Type": "application/json"}, method="PUT")
              try:
                  with urlopen(req, timeout=25) as f:
                      if f.status not in (200, 201):
                          raise RuntimeError("점수 기록 GitHub 저장 실패")
              except HTTPError as e:
                  raise RuntimeError(f"점수 기록 GitHub 저장 실패 (HTTP {e.code})") from None
              print(f"PASS: 날짜별 점수 기록 {len(dates)}일 저장 (가격·인증키 비게시)")


          def publish_public_scores(now, rows, source, requested, quoted):
              """Write only *derived* scores to public GitHub, NEVER prices/volumes/tokens.

              Repo is public. Publishing raw market data is intentionally disabled.
              Trade decisions must not depend on the resulting scores alone.
              """
              import base64
              from urllib.request import Request, urlopen
              from urllib.error import HTTPError

              token = os.getenv("GITHUB_TOKEN")
              repo = os.getenv("GITHUB_REPOSITORY")
              if not token or not re.fullmatch(r"[\w.-]+/[\w.-]+", repo or ""):
                  raise RuntimeError("GitHub workflow token/repository missing")
              ranked = [r for r in rows if r.get("score") is not None]
              doc = {
                  "schema": "jongbe-v6.2-public-scores",
                  "session_date": now.date().isoformat(),
                  "generated_kst": now.strftime("%Y-%m-%d %H:%M KST"),
                  "source": source,
                  "requested_count": requested,
                  "quoted_count": quoted,
                  "quote_timestamp_verified": False,
                  "warning": "점수는 상승 확률이나 매수 추천이 아님. API 시세 체결 시각 미검증.",
                  "rows": [
                      {"code": r["code"], "name": r["name"],
                       "score": int(r["score"]), "caution": r["caution"]}
                      for r in ranked
                  ]
              }
              blob = json.dumps(doc, ensure_ascii=False, indent=2).encode("utf-8") + b"\n"
              endpoint = f"https://api.github.com/repos/{repo}/contents/v6-scores.json"
              headers = {
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "User-Agent": "jongbe-v6.2-scores-only",
                  "X-GitHub-Api-Version": "2022-11-28",
              }
              sha = None
              previous = None
              try:
                  get = Request(endpoint + "?ref=main", headers=headers)
                  with urlopen(get, timeout=15) as f:
                      existing = json.load(f)
                  sha = existing.get("sha")
                  try:
                      previous = json.loads(base64.b64decode(existing.get("content", "")).decode("utf-8"))
                  except (ValueError, TypeError, UnicodeError):
                      previous = None
              except HTTPError as e:
                  if e.code != 404:
                      raise RuntimeError(f"GitHub score file metadata check failed (HTTP {e.code})") from None
              body = {
                  "message": "data: update derived v6.2 observation scores",
                  "branch": "main",
                  "content": base64.b64encode(blob).decode("ascii"),
              }
              if sha:
                  body["sha"] = sha
              req = Request(endpoint, data=json.dumps(body).encode("utf-8"),
                            headers={**headers, "Content-Type": "application/json"},
                            method="PUT")
              try:
                  with urlopen(req, timeout=20) as f:
                      status = f.status
                  if status not in (200, 201):
                      raise RuntimeError("GitHub score update returned non-success status")
              except HTTPError as e:
                  raise RuntimeError(f"GitHub score update failed (HTTP {e.code})") from None
              persist_v6_history(token, repo, previous, doc)


          def main():
              now = datetime.now(KST)
              event = os.getenv("GITHUB_EVENT_NAME", "workflow_dispatch")
              scheduled = event == "schedule"
              session = market_session(now)
              in_window = session and time(14, 25) <= now.time() <= time(15, 10)
              if scheduled and not in_window:
                  write_summary(f"## v6 장중 관찰 보류\n{now:%Y-%m-%d %H:%M KST} — 휴장일 또는 예약 실행 지연으로 장중 유효 시간대를 벗어남. 시세 조회하지 않음.")
                  return
              if not os.getenv("NHPLUG_APP_KEY") or not os.getenv("NHPLUG_APP_SECRET"):
                  print("FAIL: GitHub Secrets NAMUH_APP_KEY / NAMUH_APP_SECRET_KEY를 확인하세요.")
                  sys.exit(1)
              from nhplug import call
              stocks, source = candidates(now)
              rows = []
              bad = []
              for code, name in stocks:
                  try:
                      resp = call("/krstock/quote/v1/currentPrice", {
                          "iem_cd": code, "market_cd": "UNT",
                      })
                      parsed = parse_quote(resp, code, name)
                      if parsed is None:
                          bad.append(code)
                      else:
                          rows.append(parsed)
                  except Exception:
                      # API 원문/예외 텍스트에는 인증 관련 정보가 있을 수 있어 절대 출력하지 않음.
                      bad.append(code)
              if len(rows) < 2 or len(rows) < len(stocks) * 0.70:
                  print(f"FAIL: 시세 조회 부족 — 성공 {len(rows)}/{len(stocks)}. 민감한 오류 원문은 로그에 남기지 않습니다.")
                  sys.exit(1)
              rows = enrich_scores(rows)
              complete = [r for r in rows if r["complete"]]
              show_rank = in_window
              title = "장중 관찰 결과" if show_rank else "장외/휴일 연결 시험 — 과거 시세일 수 있음"
              head = (f"## 종베 스캐너 v6 · {title}\n\n"
                      f"- **조회 작업 시각**: {now:%Y-%m-%d %H:%M:%S KST} (개별 체결 시각 아님)\n"
                      f"- **대상**: {source}; 최대 {MAX_CODES}종목 (코스피·코스닥 전 종목 검색 아님)\n"
                      f"- **시세 조회**: {len(rows)}/{len(stocks)} 종목; 점수평가 가능 {len(complete)}종목\n"
                      "- **방식**: NHPLUG REST 통합시장(UNT), 읽기 전용. 5분봉/체결강도/실시간 스트리밍 미구현.\n"
                      "- **주의**: 점수는 임의 관찰 조건이며 상승 확률, 매수 추천 또는 실거래 수익 검증이 아님.\n"
                      "- **시장 상태**: 거래소 달력 및 작업 시각 기준의 참고 판정; API 제공 시세의 실제 체결 시각은 아직 미검증.\n"
                      "\n")
              if show_rank:
                  selected = [r for r in rows if r["score"] is not None and
                              r["score"] >= 60 and not r["caution"]]
                  text = head + (f"**60점 이상 관찰 후보: {len(selected)}종목**\n\n" +
                                 (summary_table(selected[:15]) if selected else "관찰 조건 충족 종목 없음.\n") +
                                 "\n\n*시세 체결 시각·지연 여부는 추가 검증해야 합니다. 거래대금은 API 원값의 상대순위만 점수에 사용했고 원시 시세는 공개하지 않습니다.*")
              else:
                  text = head + ("**장중 종목 순위는 표시하지 않습니다.** 테스트 실행은 조회/필드 구성 확인만 가능합니다.\n\n" +
                                 f"- 평가 필드(시가·고가·저가·등락률·거래량·거래대금) 완비: {len(complete)}/{len(rows)}\n" +
                                 "- 다음 정규 거래일 장중 예약 실행에서 종가매매 후보 순위를 확인하세요.\n")
              if bad:
                  text += f"\n\n- 시세 조회 실패 코드 수: {len(bad)} (일부 API 제한 또는 종목코드 확인 필요)\n"
              write_summary(text)
              if show_rank:
                  # Publishing scores changes a PUBLIC file. It contains no currentPrice raw values.
                  publish_public_scores(now, rows, source, len(stocks), len(rows))
                  print("PASS: 공개 저장소에 종목별 파생 점수만 갱신했습니다. 시세·비밀키 비게시.")
              print(f"PASS: 조회 {len(rows)}/{len(stocks)}, 평가 완비 {len(complete)}; 장중 평가 {show_rank}; 종목 순위는 실행 요약(Summary)에 표시")


          if __name__ == "__main__":
              main()
