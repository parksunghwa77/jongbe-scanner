name: V8.8.4 Namuh daily date-key check (read-only)

on:
  push:
    branches: [v8.8.4-test]
    paths: ['.github/workflows/v884-namuh-date-key-check.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      NHPLUG_APP_KEY: ${{ secrets.NAMUH_APP_KEY }}
      NHPLUG_APP_SECRET: ${{ secrets.NAMUH_APP_SECRET_KEY }}
      NHPLUG_BASE_URL: https://api.nhplug.com:8443
      NHPLUG_AUTH_URL: https://api.nhplug.com:8443
      NHPLUG_RATE_LIMIT: '2'
    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install official SDK
        run: python -m pip install --disable-pip-version-check nhplug==0.4.1
      - name: Discover daily quote date keys safely
        shell: bash
        run: |
          python - <<'PY'
          import json, os, re, time
          from datetime import date, datetime
          from pathlib import Path
          from nhplug import call

          target = '2026-10-30'
          path = Path('v884-namuh-date-key-report.json')
          data = {'schema':'jongbe-v884-date-key-v1','target':target,'results':[],
                  'note':'Only public stock daily key NAMES, parsed public dates, prices are stored. No raw response, account, secrets or tokens.'}
          if not os.getenv('NHPLUG_APP_KEY') or not os.getenv('NHPLUG_APP_SECRET'):
              raise SystemExit('Required NHPLUG GitHub Secrets unavailable.')
          def safe_day(v):
              if not isinstance(v, (str,int,float)): return None
              t = re.sub(r'[^0-9]', '', str(v))
              if len(t) != 8 or not t.startswith('20'): return None
              try:
                  d = datetime.strptime(t, '%Y%m%d').date()
                  if date(2020, 1, 1) <= d <= date(2030, 12, 31):
                      return d.isoformat()
              except ValueError: pass
              return None
          def safe_price(v):
              s = re.sub(r'[,\s]', '', str(v or ''))
              return int(s) if re.fullmatch(r'\d{1,9}',s) and int(s) > 0 else None
          for stock in ('005930','000660'):
              for market, regular in (('KRX','Y'),('UNT','N')):
                  item = {'code':stock,'market_cd':market,'regular_only':regular,
                          'row_count':0,'field_names':[],'date_field_names':[],
                          'date_examples':[],'target_close':None,'status':'unknown'}
                  try:
                      r = call('/krstock/quote/v1/currentDaily',{
                          'market_cd':market,'iem_cd':stock,'array_cnt':'30','view_main_yn':regular})
                      rows = r.get('Output_0') if isinstance(r,dict) else None
                      if isinstance(rows,dict):rows=[rows]
                      if not isinstance(rows,list):rows=[]
                      item['row_count']=len(rows)
                      if rows and isinstance(rows[0],dict):
                          # Keys only; field contents are never dumped.
                          item['field_names'] = sorted(k for k in rows[0] if isinstance(k,str))[:100]
                          candidates = {}
                          for row in rows:
                              if not isinstance(row,dict):continue
                              for k,v in row.items():
                                  if not isinstance(k,str):continue
                                  if not any(z in k.lower() for z in ('date','ymd','day','bsop','trd','dt','dd')):continue
                                  d = safe_day(v)
                                  if d: candidates.setdefault(k,[]).append((d,row))
                          item['date_field_names']=sorted(candidates)
                          for k,records in candidates.items():
                              item['date_examples'].append({'field':k,'days':[d for d,_ in records[:5]]})
                              for d,row in records:
                                  if d == target:
                                      item['target_close'] = safe_price(row.get('stck_clpr'))
                          item['status']='dates_found' if candidates else 'no_candidate_dates'
                      else:item['status']='no_rows'
                  except Exception as ex:
                      item['status']='query_error'
                      item['error_type']=type(ex).__name__
                  data['results'].append(item)
                  print(f'{stock} {market}/{regular} rows={item["row_count"]}, '
                        f'keys={item["field_names"]}, candidate_dates={item["date_examples"]}, '
                        f'target_close={item["target_close"]}, status={item["status"]}',flush=True)
                  time.sleep(0.7)
          path.write_text(json.dumps(data,ensure_ascii=False,indent=2),encoding='utf-8')
          print('SAFE DATE FIELD CHECK COMPLETE; this does not modify prices, website or trades.')
          PY
      - name: Upload sanitized diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v884-namuh-date-keys-${{ github.run_id }}
          path: v884-namuh-date-key-report.json
          if-no-files-found: warn
          retention-days: 7
