name: V7 Price Validator (test only)

on:
  push:
    branches:
      - dev-naver-v7
    paths:
      - v7_price_validator.py
      - .github/workflows/v7-price-test.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    if: github.ref == 'refs/heads/dev-naver-v7'
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install pandas FinanceDataReader
      - name: Validate Naver price data (no deployment)
        run: python v7_price_validator.py
